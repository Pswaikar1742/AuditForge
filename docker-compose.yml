version: '3.8'

services:
  # Primary Enterprise Transaction Database
  db:
    image: postgres:16-alpine
    container_name: auditforge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: auditforge
      POSTGRES_PASSWORD: auditforge_password
      POSTGRES_DB: auditforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditforge -d auditforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Distributed Job & Scan Queue Broker
  redis:
    image: redis:7-alpine
    container_name: auditforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # AuditForge REST API & Security Engine
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auditforge-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://auditforge:auditforge_password@db:5432/auditforge
      - REDIS_URL=redis://redis:6379/0
      - AUDITFORGE_INFERENCE_PROVIDER=ollama
      - OLLAMA_HOST=http://host.docker.internal:11434
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Asynchronous Background Scan Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auditforge-worker
    command: ["python", "-m", "auditforge.queue.worker"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://auditforge:auditforge_password@db:5432/auditforge
      - REDIS_URL=redis://redis:6379/0
      - AUDITFORGE_INFERENCE_PROVIDER=ollama
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # React / Vite Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: auditforge-dashboard
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  pgdata:
  redisdata:
